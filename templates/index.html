<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食物智能分类系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff9966 0%, #ff5e62 50%, #f7971e 100%);
    padding: 32px 20px;
  }
  .container { max-width: 1080px; margin: 0 auto; }
  .header { text-align: center; color: #fff; margin-bottom: 28px; }
  .header h1 { font-size: 34px; letter-spacing: 2px; text-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .header p { margin-top: 10px; font-size: 15px; opacity: .95; }
  .tags { margin-top: 14px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .tags span {
    background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.45);
    padding: 5px 16px; border-radius: 20px; font-size: 13px; color: #fff;
  }
  .panel {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
  }
  .card {
    background: #fff; border-radius: 18px; padding: 26px;
    box-shadow: 0 12px 34px rgba(120,40,0,.18);
  }
  .card h2 { font-size: 18px; color: #444; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
  .card h2::before { content: ""; width: 6px; height: 20px; border-radius: 3px; background: linear-gradient(#ff9966,#ff5e62); }
  .drop-zone {
    border: 2px dashed #ffb48f; border-radius: 14px; padding: 34px 18px;
    text-align: center; color: #b5704a; cursor: pointer; transition: .2s;
    background: #fff8f3;
  }
  .drop-zone:hover, .drop-zone.drag { background: #fff0e6; border-color: #ff7a3d; }
  .drop-zone .icon { font-size: 42px; }
  .drop-zone p { margin-top: 10px; font-size: 14px; }
  .drop-zone .hint { font-size: 12px; color: #c9a08a; margin-top: 6px; }
  #fileInput { display: none; }
  .preview { margin-top: 16px; text-align: center; display: none; }
  .preview img { max-width: 100%; max-height: 230px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
  .btn {
    width: 100%; margin-top: 18px; border: none; padding: 14px; border-radius: 12px;
    font-size: 16px; font-weight: bold; color: #fff; cursor: pointer;
    background: linear-gradient(135deg,#ff9966,#ff5e62);
    box-shadow: 0 6px 16px rgba(255,94,98,.35); transition: .15s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:disabled { background: #ddd; cursor: not-allowed; box-shadow: none; transform: none; }
  .result-empty { text-align: center; color: #bbb; padding: 60px 0; font-size: 14px; }
  .result-empty .big { font-size: 46px; margin-bottom: 12px; }
  #result { display: none; }
  .result-cat {
    text-align: center; background: linear-gradient(135deg,#fff4ee,#ffe9dc);
    border-radius: 14px; padding: 22px; margin-bottom: 18px;
  }
  .result-cat .label { font-size: 13px; color: #b5704a; }
  .result-cat .cat { font-size: 34px; font-weight: bold; color: #ff5e62; margin: 6px 0; }
  .result-cat .conf { font-size: 14px; color: #777; }
  .bar-row { margin-bottom: 14px; }
  .bar-row .top { display: flex; justify-content: space-between; font-size: 13px; color: #666; margin-bottom: 5px; }
  .bar-bg { height: 10px; background: #f0e6e0; border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg,#ffb48f,#ff5e62); width: 0; transition: width .8s ease; }
  .loading { text-align: center; color: #ff7a3d; font-size: 14px; padding: 30px 0; display: none; }
  .error { color: #e53935; font-size: 13px; margin-top: 12px; text-align: center; display: none; }
  @media (max-width: 760px) { .panel { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🍽 食物智能分类系统</h1>
    <p>基于 PyTorch 卷积神经网络 · 上传图片即可自动识别食物类别</p>
    <div class="tags">
      {% for c in categories %}<span>{{ c }}</span>{% endfor %}
    </div>
  </div>

  <div class="panel">
    <!-- 上传区 -->
    <div class="card">
      <h2>上传图片</h2>
      <div class="drop-zone" id="dropZone">
        <div class="icon">📷</div>
        <p>点击选择图片，或将图片拖拽到此处</p>
        <div class="hint">支持 JPG / PNG / BMP 格式</div>
      </div>
      <input type="file" id="fileInput" accept="image/*">
      <div class="preview" id="preview"><img id="previewImg" alt="预览"></div>
      <button class="btn" id="submitBtn" disabled>开始识别</button>
      <div class="loading" id="loading">🔍 正在识别中，请稍候...</div>
      <div class="error" id="error"></div>
    </div>

    <!-- 结果区 -->
    <div class="card">
      <h2>识别结果</h2>
      <div class="result-empty" id="empty">
        <div class="big">🥗</div>
        <p>上传图片后，识别结果将显示在这里</p>
      </div>
      <div id="result">
        <div class="result-cat">
          <div class="label">预测类别</div>
          <div class="cat" id="catName">—</div>
          <div class="conf">置信度：<span id="confVal">0</span>%</div>
        </div>
        <div id="probBars"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const previewImg = document.getElementById('previewImg');
  const submitBtn = document.getElementById('submitBtn');
  const loading = document.getElementById('loading');
  const errorBox = document.getElementById('error');
  const empty = document.getElementById('empty');
  const resultBox = document.getElementById('result');
  let selectedFile = null;

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', e => { if (e.target.files.length) handleFile(e.target.files[0]); });

  function handleFile(file) {
    if (!file.type.startsWith('image/')) { showError('请选择有效的图片文件'); return; }
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = e => { previewImg.src = e.target.result; preview.style.display = 'block'; };
    reader.readAsDataURL(file);
    submitBtn.disabled = false;
    errorBox.style.display = 'none';
  }

  function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; }

  submitBtn.addEventListener('click', () => {
    if (!selectedFile) return;
    const fd = new FormData();
    fd.append('file', selectedFile);
    loading.style.display = 'block';
    submitBtn.disabled = true;
    errorBox.style.display = 'none';
    fetch('/predict', { method: 'POST', body: fd })
      .then(r => r.json())
      .then(data => {
        loading.style.display = 'none';
        submitBtn.disabled = false;
        if (data.error) { showError(data.error); return; }
        empty.style.display = 'none';
        resultBox.style.display = 'block';
        document.getElementById('catName').textContent = data.category;
        document.getElementById('confVal').textContent = data.confidence;
        const bars = document.getElementById('probBars');
        bars.innerHTML = '';
        data.probs.forEach(item => {
          const row = document.createElement('div');
          row.className = 'bar-row';
          row.innerHTML = `<div class="top"><span>${item.name}</span><span>${item.prob}%</span></div>
            <div class="bar-bg"><div class="bar-fill" data-w="${item.prob}"></div></div>`;
          bars.appendChild(row);
        });
        setTimeout(() => {
          document.querySelectorAll('.bar-fill').forEach(b => b.style.width = b.dataset.w + '%');
        }, 80);
      })
      .catch(err => {
        loading.style.display = 'none';
        submitBtn.disabled = false;
        showError('网络请求失败：' + err.message);
      });
  });
</script>
</body>
</html>
